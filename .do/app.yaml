name: cherryai
region: atl

static_sites:
  - name: web
    github:
      repo: kerryhatcher/cherryai-web
      branch: main
      deploy_on_push: false
    source_dir: /
    build_command: npm run build
    output_dir: dist
    routes:
      - path: /

services:
  - name: api
    github:
      repo: kerryhatcher/cherryai-api
      branch: main
      deploy_on_push: false
    source_dir: /
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xs
    routes:
      - path: /api
        preserve_path_prefix: true
      - path: /auth
        preserve_path_prefix: true
      - path: /users
        preserve_path_prefix: true
      - path: /admin
        preserve_path_prefix: true
    health_check:
      http_path: /api/health
    envs:
      - key: DATABASE_URL
        type: SECRET
      - key: AUTH_SECRET
        type: SECRET
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: FACT_EXTRACTION_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        type: SECRET
      - key: OLLAMA_API_KEY
        type: SECRET
      - key: TAVILY_API_KEY
        type: SECRET
      - key: BRAVE_API_KEY
        type: SECRET
      - key: CHERRYAI_ADMIN_EMAIL
        type: SECRET
      - key: CHERRYAI_ADMIN_PASSWORD
        type: SECRET

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: kerryhatcher/cherryai-api
      branch: main
      deploy_on_push: false
    source_dir: /
    dockerfile_path: Dockerfile
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: uv run python3 scripts/ensure_pgvector.py && uv run alembic upgrade head && uv run cherryai users bootstrap
    envs:
      - key: DATABASE_URL
        type: SECRET
      - key: CHERRYAI_ADMIN_EMAIL
        type: SECRET
      - key: CHERRYAI_ADMIN_PASSWORD
        type: SECRET
